# MiniCPM5-2B: OpenBMB's own GGUF conversion (official repo, Apache-2.0), a
# plain `llama`-arch dense stack that the engine serves through the granite
# graph with its scalars at identity. Both files are the upstream bytes -
# sha256 = the repo's LFS oid, re-verified after download. Same-weights greedy
# parity against llama.cpp b11095 on both: step-0 18/18, delta-margin median
# 0.155 nats (Q8_0) / 0.222 (Q4_K_M), the long streams parting only at
# sub-0.1-nat ties (A6000, 2026-09-22). The GGUF stamps the card's own
# sampling (temperature 1.0, top_p 0.95), which the runner reads off the file.

