  context = "4K"
  homepage = "https://huggingface.co/ibm-granite/granite-speech-4.1-2b"
  about = "IBM's prompt-driven speech model: the instruction picks the task, so the same checkpoint writes a punctuated transcript, translates it, or biases recognition toward a keyword list."
  strengths = [
    "Punctuated, capitalized transcripts - not raw lowercase text",
    "Speech translation and keyword biasing from the same weights",
    "Seven languages including Japanese",
  ]
  tradeoffs = [
