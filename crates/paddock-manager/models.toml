  strengths = [
    "Compact ternary weights: 5.9 GB GGUF or 8.6 GB MLX with bundled vision",
    "Fast generation for its class: little memory to read per token",
    "256K context on the Qwen 3.8 hybrid backbone",
  ]
  tradeoffs = [
    "Ternary weights: close to the original, not identical",
