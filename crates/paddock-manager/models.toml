# Laguna S sourcing: the weights here are UNSLOTH's, which breaks
# the official-first rule deliberately and under its documented carve-out -
# unsloth only when the official file is absent or does not fit. poolside's own
# GGUF ladder for S-2.1 is F16 219.05 / Q8_0 119.91 / Q4_K_M 89.44 GiB. The
# 96 GB card this model targets cannot serve the 89.44 GiB one: it would leave
# about 6 GB for the engine and the whole KV pool. unsloth's UD-Q4_K_XL is
# 68.36 GiB and leaves ~25 GB, which is the configuration that actually ran.
#
# "Actually ran" is the other rule, and an A6000 cannot
# hold 68 GiB. These exact bytes (repo commit 750f92f9, sha256 cross-checked
# against the download metadata before publishing) served 32/32
# concurrent requests on the 96 GB Blackwell card the model is for. The
# drafter is poolside's own.

[[model]]
id = "laguna-s-2.1"
# KV8 by default (2026-10-04): mirrors the engine family default
kv_default = "fp8_e4m3"
vendor = "Poolside"
display = "Laguna S 2.1"
family = "laguna"
capability = ["chat", "tools", "reasoning", "speculative"]
license = "openmdw-1.1"
revision = "2026-08-05"

  [model.specs]
  params = "118B · 8B active"
  context = "1M"
  published_at = "2026-07-21"
  published_source = "https://poolside.ai/blog/introducing-laguna-s-2-1"
  homepage = "https://huggingface.co/poolside/Laguna-S-2.1"
  about = "The big Laguna - built for coding and long agent runs, and still quick per token because only a small slice of it runs at a time."
  strengths = [
    "Much stronger than the XS on hard coding and agent work",
    "Fast for its size - 8B of 118B parameters run per token",
    "1M context, the longest window in this catalog",
  ]
  tradeoffs = [
    "68 GB download, and it wants a 96 GB card - it will not fit a desktop GPU",
    "Text only - no image input",
    "Arrives as three files that are downloaded together",
  ]

  # Three-file gguf-split. SHARD 1 must be LISTED first - the spawn path hands
  # the runner `files.first()` and the engine walks the rest from that shard's
  # own split metadata. A registry test enforces the ordering.
  [[model.artifact]]
