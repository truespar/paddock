# ── image generation ─────────────────────────────────────────────────────────
#
# Qwen-Image-2.1 (released 2026-09-20): the first image-generation model here,
# and the first under a NON-COMMERCIAL licence - the Qwen Research License
# (research and evaluation only; commercial use needs a licence from Qwen), so
# "non-commercial / preview" is its honest name everywhere it shows. Served by
# gpu_model/qwen_image over POST /v1/images/generations: a 7B single-stream
# DiT (the weights), the Qwen3-VL-8B text encoder (companion, required - the
# DiT conditions on its hidden states; the compact DiT pairs with the compact
# encoder) and the official 64-channel VAE (companion, required - it turns
# latents into pixels). No KV cache, no context window: priced as a single
# pass - weights + companions + the render's workspace. Text to image only;
# editing (the encoder's vision tower, the VAE encoder) is the next phase.
#
# Qwen ships no GGUF of the DiT; unsloth's conversion is the elected line
# (Q8_0 default, Q4_K_M compact - no UD-Q4_K_XL exists for it). The text
# encoder is the OFFICIAL Qwen/Qwen3-VL-8B-Instruct-GGUF (Apache-2.0), the VAE
# the official safetensors from Qwen/Qwen-Image-2.1 (F32 on disk; resident as
# f16 GEMM planes). LICENSE sits beside the DiT bytes and beside the VAE on
# R2, as the agreement's s.3(a) requires.
#
# Numbers (A6000, 2026-09-22, tests/gpu_qwen_image_t2i.rs): resident weights
# are the loader's own ledger; `workspace` is the render's transient at the
# default 1024^2 (the nvidia-smi peak less weights and the CUDA context). It
# grows with the output - ~9 GB at 1280^2, ~22 GB at 2048^2, ~31 GB at the
# 2752 ceiling, most of it the whole-plane VAE decode - so a bigger render on
# a smaller card fails with an allocation error, never silently. A tiled VAE
# decode is the target that removes that growth.

[[model]]
id = "qwen-image-2.1"
vendor = "Alibaba"
display = "Qwen-Image 2.1"
family = "qwen-image"
capability = ["image-generation"]
license = "qwen-research"
revision = "2026-09-22"

