# card is explicit: the model "is specifically designed for structured
# extraction tasks and may not generalize well to open-ended vision-language
# tasks", and it takes English instructions only. The same chip the Qwen and
# Gemma vision models carry would promise general image chat and under-deliver,
# so it gets its own - the picker says "Documents & charts" and means it.
#
# The RUNNER still advertises `vision: true` and `input_modalities: [text,
