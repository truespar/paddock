  published_source = "https://huggingface.co/Qwen/Qwen-Image-2.1/commit/790c92633540aa0cb11d9abf19eb46d861714758"
  about = "Alibaba's image model: a picture from a text prompt, with any text in the picture rendered legibly. Non-commercial, and a preview here."
  strengths = [
    "Renders text inside images well - signs, labels, posters",
    "Any size on a 32-pixel grid up to 2752 a side, transparent backgrounds, and every render seeded and reproducible",
    "Prompts are read by a full 8B language model, so long descriptions hold together",
  ]
  tradeoffs = [
    "Non-commercial: the Qwen Research License allows research and evaluation only",
    "Reference-image editing uses the optional GGUF vision tower or the MLX package's embedded tower",
    "Three downloads and 17 GB of VRAM at full quality (10 GB compact), plus room that grows with the picture: about 6 GB more at 1024 x 1024",
