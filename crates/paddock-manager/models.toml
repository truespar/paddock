  # primitive-ai's NVFP4 checkpoint on CUDA (user-elected 2026-10-07):
  # compressed-tensors, routed experts W4A4 NVFP4, everything else BF16. The
  # Blackwell alternative to the GGUF above, not the default: it processes
  # prompts ~8% faster (10.9K TTFT 2.67 vs 2.91 s on GB10) but decodes ~1.9x
  # slower, since every non-expert plane stays BF16. sm_120a or better: the
  # W4A16 decode consumers and the W4A4 block-scaled prefill pair compile
  # under PD_BS_OK only.
