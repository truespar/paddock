# Qwen3.8-Flash-Next sourcing: the weights are unsloth's UD export of
# Qwen/Qwen3.8-Flash-Next (quantiser repo huggingface.co/unsloth, recorded in
# the file's own general.repo_url); every shard sha256 here is the upstream LFS
# oid, re-verified against the bytes at upload.
#
# UD-IQ3_XXS is the DEFAULT lane, and it was not a taste: when this entry
# landed it was the largest upstream file the engine could seat - its ROUTED
# expert seats are all i-quant (IQ2_S gate/up, IQ4_NL down, IQ3_S on one
# layer), where the 4-bit UD files upcast some expert planes to Q8_0 and Q5_1
# and the routed path had no seat for those.
#
# That last part is no longer true (2026-09-15): the flat 32-weight seats (pack
# slot 600 `kquant_flat32`, the loader's per-tensor `kq_layout` dispatch) serve
# Q5_1 / Q8_0 routed experts, UD-Q4_K_XL loads, and it is the file the Spark
# prefill campaign measures on - 18/18 greedy parity against llama.cpp on the
# same GGUF. So it is published here too (2026-09-16): 111.3 GB over four
# shards, measured at 85.2 GB resident.
#
# That measurement is also why it is not the default. 85.2 GB of weights before
# a single KV byte is the same arithmetic that rules NVFP4 out below, so a 96 GB
# card does not serve this file either - it wants the 128 GB class the prefill
# campaign runs on, and IQ3 (56.6 GB resident) is the lane that fits a 96 GB
# card. Both shapes are published, so the picker prices that per box instead of
# guessing from file size.
#
# NVFP4 is a separate lane and still not published: 84 GB resident before KV
# does not fit a 96 GB card.
#
# CUDA: the n-gram embedding is 51B of the parameter count and stays HOST-MAPPED -
# the engine gathers 8 rows a token straight from the file's mmap - so each
# resident figure below sits ~24 GiB under its own download (76.3 -> 52.7 GiB
# for IQ3, 103.7 -> 79.4 GiB for the 4-bit), and a cold page cache costs a disk
# seek per row on the first pass.
#
# The drafter is unsloth's separate MTP head for the same model
# (MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf: blk.48 full attention + nextn
# glue, all Q8_0, borrowing the target's embedding and lm_head) - the UD export
# strips the in-file MTP block, so this file is the only way to speculate.
# sha256 re-verified through the public URL after upload (2026-09-14). The
# engine's verify rows are decode-exact, so greedy text with it attached is
# byte-identical to without - measured on a DGX Spark, 2026-09-14.

