  # the separate MTP head (see the sourcing note above) - this export has no
  # in-file one
  # local-inference-lab's quantization-aware-DISTILLED NVFP4/MXFP8 export of
  # Qwen3.8-Flash-Next.
  #
  # ATTRIBUTION - READ BEFORE EDITING THIS ROW. The export is
  # local-inference-lab/Qwen3.8-Flash-Next-NVFP4 and that repo is the SOURCE
  # OF TRUTH; credit and issues belong there. Paddock re-quantized nothing.
  # An earlier cut of this row credited a Mia-AiLab MIRROR we had fetched
  # through, which the mirror's own card disclaims - that was wrong, and it is
  # why this note exists. Nothing of that mirror survives: the bytes are now
  # pulled from upstream directly and its R2 prefix was deleted 2026-09-20.
  #
  # THE REVISION IS THE POINT, because `main` has meant two different
  # checkpoints. Until 2026-09-16 this repo held a post-training quant (34
  # shards, ModelOpt amax* calibration files alongside). Commit b13380df
  # replaced it with a distilled student: 36 shards, amax* dropped, and every
  # TRAINED tensor changed while the frozen ones stayed byte-identical (we
  # sampled both to establish exactly that - attention, vision and MTP planes
  # matched, routed experts, shared experts, PLE tables and hyper-connection
  # mixers did not). We serve the distilled one, pinned to the full sha below
  # and carried in the R2 prefix so a future re-publish cannot silently swap
  # what this row means. The earlier PTQ export was retired the same day.
  #
  # WHAT DISTILLED MEANS HERE: the student trains against the BF16 teacher
  # with quantized weights in its forward pass, so it learns to absorb
  # quantization error rather than merely rounding into it. The trained set is
  # routed experts + PLE tables (NVFP4) and shared experts (MXFP8); attention,
  # vision and the MTP head are frozen and carry the base checkpoint's values.
  # Upstream's config declares the architecture as `qwen4_exp` where the PTQ
  # export said `qwen3_8_flash_next` - the loader accepts both, deliberately.
  #
  # THE EXPORT SELF-DESCRIBES, and it corroborates all of the above: the
  # shipped `export-manifest.json` names `template_revision` ada4da32 - the
  # very PTQ export this row used to serve - and records 5,833 frozen against
  # 295,897 replaced tensors (301,730 total, 105,798,973,864 tensor bytes),
  # every count matching what we measured off the shard headers ourselves. Its
  # own validation line for the frozen set reads "full selected-tensor byte
  # equality against PTQ template", which is exactly the split our byte
  # sampling found. Base is Qwen/Qwen3.8-Flash-Next at de4b8e4d.
  #
  # CAVEAT worth carrying: activation calibration is exported
  # "with_explicit_fallback" - 6 routed experts of 24,576 (0.024%, all in
  # layer 0) were never observed and take a per-layer max scale instead of a
  # measured one. Small and disclosed, but it is a static-W4A4 footnote, and
  # the W4A4 pair is off by default for unrelated reasons (see STATE below).
  #
  # SOURCING: neither an official org nor unsloth, so it sits outside the
  # model-sourcing policy's two usual sources. Listed on an explicit
  # maintainer decision (2026-09-20), pulled once from HF at the pinned sha and
  # republished to R2 so the standing rule holds for anyone fetching it.
  # LICENSE IS NOT APACHE-2.0 - an earlier cut of this row said so and was
  # wrong. It inherits the base model's qwen-community-1.0 ("other"), which
  # is what upstream's own card declares; redistribution is permitted under
  # that licence, not a permissive one. Qwen's LICENSE ships in the bundle.
  #
  # WHY IT EARNS ITS OWN ROW: NVIDIA's NVFP4 export quantizes ONLY the routed
  # experts and leaves 9.22 GB bf16, so 6.79 GB of dense planes plus a 1.18 GB
  # bf16 lm_head are read every token - a hard ~30 tok/s ceiling on a 273 GB/s
  # die. This export's `ignore` list is EMPTY: attention, GDN linear_attn,
  # shared experts and the vision tower are MXFP8 (W8A8, group 32, block
  # [1, 32]), routed experts NVFP4 W4A4 group 16, the MTP head's NVFP4 W4A16.
  # 98.5 GiB of tensors against NVIDIA's 124 GB. The published single-Spark
  # figures for this model are measured on this export line; the distillation
  # changed weight VALUES but not one dtype, shape or plane layout, so it
  # reads at the same bytes per token and those figures still describe this
  # row's serving cost.
  [[model.artifact]]
  id = "nvfp4"
  kind = "weights"
  format = "safetensors"
  label = "NVFP4 distilled (fastest)"
  quant = "NVFP4"

  # The PRODUCING repo, not the mirror the bytes were fetched from.
  [model.artifact.source]
  repo = "local-inference-lab/Qwen3.8-Flash-Next-NVFP4"
  revision = "7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd"
  base_model = "Qwen/Qwen3.8-Flash-Next"
  license = "qwen-community-1.0"
  license_url = "https://huggingface.co/Qwen/Qwen3.8-Flash-Next/blob/main/LICENSE"

  [model.artifact.runtime]
  backends = ["cuda"]
  kv_cache_dtype = "fp8_e4m3"
  companions = []
  experimental = true
  note = "CUDA only, and cc12 in practice: the MXFP8 dense planes ride the e4m3 + ue8m0 block-scale lanes and the routed experts the packed-fp4 mma, which no other die implements. The 26.8 GiB n-gram table stays HOST-MAPPED - on a unified-memory die the mapping IS device memory, so a device copy would hold it twice - and is warmed at load. Measured ON THESE DISTILLED WEIGHTS, DGX Spark (GB10) 2026-09-20, syn 128x128 c1, spec on with the in-file MTP head and a 65536-id draft shortlist, 3 reps, clock-guard satisfied: ITL p50 21.19-22.48 ms (decode 44.5-47.2 tok/s), TTFT p50 463-635 ms, 35.8-38.4 end-to-end out tok/s, speculative acceptance 79.6%. An earlier cut of this row headlined 'decode 47.7 tok/s, TTFT 421 ms' - those were the PTQ export's W4A4-ON legs, and two different runs at that, quoted against a row that ships W4A4 OFF; they are gone rather than re-dressed. NOTE FOR RE-MEASURING: this die sustains ~2535 MHz of its advertised 3003 under this load, so a leg needs PD_CLOCK_GUARD_REF_MHZ or smoke-perf-check voids it as INVALID-CLOCKS. Upstream publishes AA-LCR 79.4, GPQA Diamond 89.9 and Tool Eval Bench 91 for this checkpoint, and reports it answering GPQA in 9% fewer tokens on average (15% median, 26% P99) than the PTQ export - an end-to-end latency win at unchanged tok/s, unverified here. STATE: the W4A4 routed pair (PADDOCK_Q38FN_NVF4_BS_MIN) is OFF by default, and on these weights it BUYS NOTHING measurable - 3 reps on and off sit inside each other's spread (on: ITL p50 21.18-22.48, TTFT 473-732; off: 21.19-22.48, 463-635), where on the retired PTQ export the same flag had looked worth a large TTFT cut. Both legs drafted and accepted identical token counts (1272/1013), which is consistent with the W4A4 arm tracking the W4A16 stream here but is not a correctness proof. Its same-weights greedy gate read 3 of 8 prompts byte-identical against W4A16 with the rest tracking 77-661 characters before parting - the expected signature of a changed activation class, not a clean pass; that gate ran on the PTQ export and has not been re-run here. Long-context, vision and broader reasoning qualification open; registry envelope 4K, not the vendor's 256K."

