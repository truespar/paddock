# ─────────────────────────────────────────────────────────────────────────────
# models.toml - the blessed-models manifest this paddock release ships with.
#
# This file is the catalog. It is compiled into the binary (include_str!).
# Artifact/backend contracts determine compatibility; benchmark/test progress
# is tracked separately and does not gate availability. There is no remote catalog; the origin
# (models.truespar.io / Cloudflare R2) is a dumb file host, and each `url` is
# stable and immutable once published.
#
# Schema 3: a model is a FAMILY of artifacts, not a file list.
#   [[model]]            one entry per model people talk about ("Qwen3.5 9B")
#   [[model.artifact]]   the pieces, each independently downloadable:
#     kind   = "weights"       alternatives - a server picks exactly one
#            | "vision"        mmproj vision tower (optional companion)
#            | "audio"         mmproj AUDIO tower - a speech encoder. Its own
#                              kind, not a vision reuse: the two imply
#                              different input capabilities, and the picker
#                              must never offer image input for a model that
#                              only hears. Charged identically (estimate.rs
#                              `tower_bytes`), since both are resident from
#                              startup.
#            | "drafter"       MTP drafter sideload (optional companion;
#                              in-file MTP exports need none)
#            | "fp8-snapshot"  official FP8/bf16 safetensors checkpoint dir -
#                              today a native-plane source over a GGUF base
#                              (PADDOCK_FP8_NATIVE); becomes a weights
#                              alternative when the engine serves it directly
#     format = "gguf" | "safetensors"
#     default = true    the row-level Download bundle = default weights +
#                       every default companion
#     quant             the honest label for weights (drives the quality tag)
#     runtime           omitted = CUDA only, never implicit Metal support
#                       backend_overrides narrow capabilities/cache/companions
#                       for one backend without changing another backend's contract
#
# Adding a model (all one release):
#   1. `powershell -File the publish tool`   # upload bytes + emit
#      a catalog manifest (url + dest + sha256 + size per file)
#   2. paste the [[model]] + [[model.artifact]] blocks here; specs from the
#      vendor's model card - sourced, never guessed
#      specs.published_at = upstream publication day (YYYY-MM-DD), with a
#      published_source URL. Not a revision or repository-creation timestamp.
#      Omit both when the day is unknown; native date sorting puts these last.
#   3. cut the release
# ─────────────────────────────────────────────────────────────────────────────

schema = 3

# User-elected MLX conversion of Aleph Alpha's FP8 release. This is a native
# Metal loader, not mlx-lm serving. Keep download availability separate from
# full-generation parity and performance qualification (see runtime.note).
# CUDA (user-elected 2026-10-07, same terms): Hob-forge's Q4_K_M GGUF and
# primitive-ai's NVFP4 checkpoint, both pinned by revision and mirrored on R2.
# No official or unsloth GGUF or NVFP4 exists.
[[model]]
id = "kolibri-1"
# KV8 on CUDA, the laguna body's default; the Metal artifact pins its own
# checkpoint-native BF16 cache (kv_cache_dtype = "auto")
kv_default = "fp8_e4m3"
vendor = "Aleph Alpha"
display = "Kolibri 1"
family = "kolibri1"
capability = ["chat", "reasoning", "tools"]
license = "apache-2.0"
revision = "2026-10-07"

  [model.specs]
  published_at = "2026-10-03"
  published_source = "https://huggingface.co/Aleph-Alpha/Kolibri-1-BF16"
  params = "78B total / 3.46B active"
  context = "262K native; 262K default on CUDA, 32K on Metal"
  homepage = "https://huggingface.co/Aleph-Alpha/Kolibri-1"
  about = "Aleph Alpha's German-English mixture-of-experts model for reasoning, retrieval and tool use. Native Metal serves the pinned mixed 4/8-bit MLX conversion with BF16 KV; CUDA serves a Q4_K_M GGUF on any generation, or the NVFP4 checkpoint on Blackwell, with FP8 KV."
  strengths = ["German and English", "Reasoning and tool calling", "Packed MoE weights"]
  tradeoffs = ["45-48 GB download; plan for at least 64 GB of GPU or unified memory", "Text only; no speculative decoder", "Metal: full-generation parity and rival performance remain under qualification"]

  [[model.artifact]]
  id = "mlx-mixed-4-8bit"
  kind = "weights"
  format = "safetensors"
  label = "MLX mixed 4/8-bit"
  quant = "MLX-AFFINE-4/8-G64"
  default = true
  workspace = 268435456

  [model.artifact.source]
  repo = "eins78/Kolibri-1-mlx-mixed-4-8-bit"
  revision = "20a42da14e58c0f9de5af5a50b6766874c259b0c"
  base_model = "Aleph-Alpha/Kolibri-1"
  license = "apache-2.0"
  license_url = "https://huggingface.co/eins78/Kolibri-1-mlx-mixed-4-8-bit/blob/20a42da14e58c0f9de5af5a50b6766874c259b0c/LICENSE"

  [model.artifact.runtime]
  backends = ["metal"]
  companions = []
  checkpoint_dir = true
  kv_cache_dtype = "auto"
  default_max_ctx = 32768
  default_max_batch = 1
  default_spec = "off"
  note = "Native packed affine 4-bit routed experts and 8-bit attention/shared projections, BF16 KV. Text, reasoning and tools; no vision, speculation or persistent KV offloading. Full-generation numerical parity and rival performance remain under qualification."

  # The loader widens only norms/router to F32, not quantized projections.
  # All 50 layers retain full paged KV for exact prefix restoration, including
  # the 40 sliding layers. Reserve one extra sequence as load.rs does; do not
  # underprice them as 513-token rings. Workspace covers scratch at batch 64.
  [model.artifact.runtime.memory]
  weight_bytes = 45381770240
  source = "measured"
  max_ctx = 262144
  max_batch = 64
  full_paged_kv = true
  kv_reserve_sequences = 1
  workspace_bytes = 268435456

  [model.artifact.shape]
  weight_bytes = 45381770240
  kind = "generative"
  vocab = 128000
  max_ctx = 262144
  nextn_bytes = 0
  source = "measured"
  kv_layers = [
    { k_dim = 512, v_dim = 512, window = 513, count = 40 },
    { k_dim = 512, v_dim = 512, count = 10 },
  ]

