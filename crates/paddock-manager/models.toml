  # Hob-forge's Q4_K_M GGUF on CUDA (user-elected 2026-10-07). The default on
  # every card, Blackwell too: on GB10 it decodes ~1.9x faster than the NVFP4
  # build below (76 vs 40.5 tok/s at one stream, 138 vs ~104 aggregate at
  # four), because NVFP4 keeps every non-expert plane BF16; NVFP4 only wins
  # prompt processing, by ~8% at 10K. No llama.cpp release reads kolibri1 yet:
  # the file was written by the patched converter the repo ships beside it.
  # Aleph Alpha's own LICENSE rides along (the repo carries none), mirrored
  # under its revision of the official release.
  [[model.artifact]]
  id = "q4"
  kind = "weights"
  format = "gguf"
  label = "Compact"
  quant = "Q4_K_M"
  default = true
  # The engine's own ledger at 262K x 4 on GB10 (2026-10-07): 50,929,723,336
  # bytes held before the KV grant, less the 50.37 GB of weights below = 0.56
  # GB of serving scratch; plus the 0.16 GiB of prefix checkpoints and the 89
  # MB by which the 40 sliding rings (66 blocks a slot) exceed the window the
  # shape prices them at.
  workspace = 820487148

  [model.artifact.source]
  repo = "Hob-forge/Kolibri-1-GGUF"
  revision = "47fb91b2420efeaa9c3df1259cd6b0c151a85048"
