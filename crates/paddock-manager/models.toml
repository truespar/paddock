# -- tabular predictors --------------------------------------------------------
# Kumo Tabular (NVIDIA): a tabular foundation model. Labelled rows go in with
# every request and the model reads them in context - no training, no tuning -
# then predicts the target of new rows: a class with its probabilities, or a
# number as 999 quantiles. Served on /v1/tabular/* (one-shot predictions, and
# fitted contexts a later query replays), never as chat.
#
# Six checkpoints, one per endpoint: small / medium / large, each with a
# classification and a regression head. Mirrored from HF nvidia/Kumo-Tabular
# at v1.0.0 (bd7fa122b516), each original PyTorch archive SHA-verified and
# re-saved as F32 safetensors unchanged - the runner never unpickles - with
# the model card and the OpenMDW licence beside the weights.
#
# A single-pass model: nothing is cached between calls but the fitted
# contexts a caller asks for. weight_bytes is the loader's own count
# (GB10, 2026-09-30); workspace is the ceiling of a pass's planes at the
# request limits (4096 labelled + 1024 query rows, 500 columns, 131072
# cells) plus the 1 GiB fitted-context cap, for the larger of the two lanes:
# Metal's 18-plane pass (medium/large 3.81 GiB, small 2.45 GiB). The fused
# CUDA arena tops out at 2.80 / 1.95 GiB.

