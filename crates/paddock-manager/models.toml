# Clef (Cloudflare, released 2026-10-01 with Clef Flash): the same joint
# schema head on a post-trained Qwen3.8-27B (64 layers, 5120 wide, its vision
# tower beside it), the same tokenizer, prompt and /v1/systemone contract.
# Stronger than Flash where a decision needs more of the world - intents
# (BANKING77 94.2 vs 90.9, CLINC150+OOS 97.4 vs 66.8), hallucination
# (RAGTruth 79.4 vs 35.6), GSM8K 80.8 vs 67.3 - and not everywhere (MMLU 90.3
# vs 91.8), at ~4x its latency (the vendor's H200: 209 vs 39 ms median).
#
# Q8_0 default (2026-10-03): ggml-org/Clef-GGUF rev
# 5f70656b6670, llama.cpp's conversion of Cloudflare/clef rev 2f3de3dd85f3 -
# the ggml-org note on Clef Flash applies - mirrored unchanged and
# sha256-checked against the LFS id; the official BF16 (51 GiB) is not
# offered. Its vision companion is our byte-for-byte cut of that release's
# tower. The same lane as Flash's Q8_0: against the release evaluated in F32
# with these Q8_0 weights, logits within 2.6e-4 and probabilities 3.0e-5 on
# the text fixtures (the 64 layers spend more of the F32 class's 5e-4 budget
# than Flash's 32), 1.9e-4 / 3.1e-5 on the image fixtures, no flips; the
# GGUF's tokenizer token-exact on all 26. Measured on the DGX Spark
# 2026-10-03: 28.73 GB resident, 6.67 GB of workspace (the tower adds 0.92 GB
# and 4.5 MB - the 27B's planes already hold it); ~580 ms a 260-token
# request, 35 s at 16K.

