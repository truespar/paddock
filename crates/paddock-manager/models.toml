  # DFlash2 block-diffusion drafter (incoai + z-lab release). This
  # model speculates from its IN-FILE MTP head by default - that is what wins
  # the batched rungs, and it needs
  # no extra download, so the drafter artifact is not the default. What
  # DFlash2 buys is single-stream latency: the engine's hybrid routing
  # drafts through it at live=1, where its 7-token blocks at ~85%/token
  # acceptance beat the MTP lane substantially, and hands
  # wider rounds back to the MTP chain. Speculation is lossless - identical
  # output either way, only speed differs - so this is an ARTIFACT of one
  # model, not a second model (the muse DFlash1/2 rule).
  # Upstream: incoai/Qwen3.8-27B-DFlash2-GGUF (z-lab mirrors it), file
  # Qwen3.8-27B-DFlash2-Q4_K_M.gguf. Verified identical to what we mirror,
  # not assumed: HF's x-linked-etag (the LFS sha256) was
  # 18a380efc9b7ed8d88677fc895f5c11ae170653434ee378f7348f715c14d0594 and its
  # x-linked-size 1143006752 - both match the bytes below exactly. The name
  # differs because this tree's drafters are named by role (muse precedent).
  # Upstream moved on 2026-08-29 ("Add dflash.rope.dimension_sections to
  # GGUFs (mrope fix)": +64 bytes, sha256 1a25c568...131ebd, both HF repos).
  # The mirror keeps the 2026-08-18 bytes deliberately: paddock's drafter
  # loader (qwen35/dflash.rs) reads no such key, so the two files draft
