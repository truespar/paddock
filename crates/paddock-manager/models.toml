# ─────────────────────────────────────────────────────────────────────────────
# models.toml - the blessed-models manifest this paddock release ships with.
#
# This file is the catalog. It is compiled into the binary (include_str!), so a
# given paddock build only ever offers models it was built to load - compatibility
# is guaranteed by construction. There is no remote catalog to fetch; the origin
# (models.truespar.io / Cloudflare R2) is a dumb file host, and each `url` is
# stable and immutable once published.
#
# Schema 3: a model is a FAMILY of artifacts, not a file list.
#   [[model]]            one entry per model people talk about ("Qwen3.5 9B")
#   [[model.artifact]]   the pieces, each independently downloadable:
#     kind   = "weights"       alternatives - a server picks exactly one
#            | "vision"        mmproj vision tower (optional companion)
#            | "audio"         mmproj AUDIO tower - a speech encoder. Its own
#                              kind, not a vision reuse: the two imply
#                              different input capabilities, and the picker
#                              must never offer image input for a model that
#                              only hears. Charged identically (estimate.rs
#                              `tower_bytes`), since both are resident from
#                              startup.
#            | "drafter"       MTP drafter sideload (optional companion;
#                              in-file MTP exports need none)
#            | "fp8-snapshot"  official FP8/bf16 safetensors checkpoint dir -
#                              today a native-plane source over a GGUF base
#                              (PADDOCK_FP8_NATIVE); becomes a weights
#                              alternative when the engine serves it directly
#     format = "gguf" | "safetensors"
#     default = true    the row-level Download bundle = default weights +
#                       every default companion
#     quant             the honest label for weights (drives the quality tag)
#
# Adding a model (all one release):
#   1. `powershell -File the publish tool`   # upload bytes + emit
#      a catalog manifest (url + dest + sha256 + size per file)
#   2. paste the [[model]] + [[model.artifact]] blocks here; specs from the
#      vendor's model card - sourced, never guessed
#   3. cut the release
# ─────────────────────────────────────────────────────────────────────────────

schema = 3

# ── generative (chat) ────────────────────────────────────────────────────────

