# IBM's granite-speech pair. Same shape as Qwen3-ASR - a granite
# dense decoder fed by a conformer + Q-Former speech tower that ships as an
# mmproj companion - but PROMPT-DRIVEN: the instruction picks the task, so one
# checkpoint does plain transcription, translation, keyword biasing and (on
# -plus) speaker labels and word timings. Both files are IBM's own GGUF
# conversions, not ours.
#
# The two are siblings, not an upgrade path, and the card is explicit about the
# trade: -plus adds speaker-attributed ASR and word-level timestamps but drops
# punctuation and capitalization, and scores 5.71 average WER on the Open ASR
# leaderboard against the base's 5.33. Whichever a user wants, they must be
# able to see the difference before downloading 3 GB - hence two rows with the
# trade in the strengths/tradeoffs rather than one row with a quant picker.

[[model]]
id = "granite-speech-4.1-2b"
vendor = "IBM"
display = "Granite Speech 4.1 2B"
family = "granite"
capability = ["transcription"]
license = "apache-2.0"
revision = "2026-08-09"

