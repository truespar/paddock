# -- promptable segmentation ---------------------------------------------------
# SAM 3 (Meta): a picture and a concept in words ("yellow school bus") and/or
# exemplar boxes in, every matching object's mask, box and score out, served
# on POST /v1/masks (COCO RLE masks). Never chat: a picture and a prompt are
# the whole input. CUDA only for now.
#
# NOT mirrored. The SAM License lets us use the weights but Meta gates them
# behind its terms on Hugging Face, so the files download from facebook/sam3
# itself, with the user's own Hugging Face token, once they have accepted the
# terms there (`source.gated`, registry/gated.rs). The revision and every hash
# are pinned exactly as for our mirror. Only what the engine reads is fetched:
# model.safetensors (F32, byte-identical to Meta's sam3.pt, which is a pickle
# and never downloaded), config.json and tokenizer.json, with Meta's LICENSE
# and model card beside them.
#
# A single-pass model: nothing is cached between calls except the last
# picture's encoding and the last prompt's text features (exact reuse, by
# bytes). weight_bytes is the loader's own count (A6000, 2026-10-06: image
# encoder 881 + text tower 770 + detector 66 MiB of f16 planes); workspace is
# the resident planes (1654 MiB) plus the request planes for a 24 MP picture
# and its run lists (124 MiB).
[[model]]
id = "sam3"
vendor = "Meta"
display = "SAM 3"
family = "sam3"
capability = ["masks"]
license = "sam-license"
revision = "2026-10-07"

  [model.specs]
  published_at = "2025-11-19"
  published_source = "https://huggingface.co/facebook/sam3"
  params = "860M"
  context = "One picture up to 24 MP, a prompt of up to 30 tokens, 16 exemplar boxes"
  homepage = "https://huggingface.co/facebook/sam3"
  about = "Finds every object that matches a short description - or that looks like a box you drew - and returns each one's mask, box and score. Ask again about the same picture and only the prompt is new work."
  strengths = [
    "Every instance of a concept in one request, not one object per click",
    "Text, example boxes, or both - negative boxes say what not to include",
    "A repeated picture skips its encoding: new prompts come back in milliseconds",
  ]
  tradeoffs = [
    "Gated: accept Meta's licence on Hugging Face and use your own token to download",
    "Short noun phrases, not instructions - it finds things, it does not reason",
    "CUDA only for now; video tracking and click prompts are still to come",
  ]

  [[model.artifact]]
  id = "f32"
  kind = "weights"
  format = "safetensors"
  label = "Official F32 (served as f16)"
  quant = "F32"
  default = true
  workspace = 1863899136

  [model.artifact.source]
  repo = "facebook/sam3"
  base_model = "facebook/sam3"
  license_url = "https://huggingface.co/facebook/sam3/blob/3c879f39826c281e95690f02c7821c4de09afae7/LICENSE"
  revision = "3c879f39826c281e95690f02c7821c4de09afae7"
  license = "sam-license"
  gated = true

  [model.artifact.runtime]
  backends = ["cuda"]
  checkpoint_dir = true
  # one model, one pass: no drafter, no tower, nothing rides along
  companions = []

