# Røst's licence is a CUSTOM instrument, not an SPDX id: "MODEL - LICENSE to
# USE" from Alvenir ApS, built on the AI PUBS open RAIL-M LICENSE, governed by
# Danish law, with Attachment A's use restrictions plus Alvenir's own §4
# supplement (no impersonation / synthetic speech). Commercial use is allowed.
# Hence `coral-openrail-m` rather than a bare `openrail`: the tag has to say
# "custom, OpenRAIL-M-derived" or a reader will assume the standard terms.
# The Røst repo ships no LICENSE file of its own - the canonical text lives at
# Alvenir/coral-1-whisper-large - so it is uploaded to R2 as LICENSE.txt
# beside the GGUF, the way laguna's OpenMDW notices were, because the product
# principles require the notice to travel with the bytes.
#
# NAME: upstream renamed this repo. `roest-whisper-1.5b-v2` 307-redirects to
# `roest-v3-whisper-1.5b` (trained on coral-v3), and our conversion is of that
# repo's current weights - so the row carries the upstream name, not the alias
# we first pulled it under.
