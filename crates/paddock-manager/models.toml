# ── decision models ──────────────────────────────────────────────────────────
# Laya (ConvAI Innovations): ModernBERT under a trained head that scores each
# option of a typed question at its own [MASK] - the open model built for
# TypeSafe Jev's /v1/systemone. Nothing is generated; one bidirectional pass
# per question. One bundle, three checkpoints behind the model's own language
# router: English at the root (ModernBERT-large), multilingual (mmBERT-base,
# 100+ languages) and typed-decisions (English, fine-tuned on four workflows,
# chosen only by name). Mirrored unchanged from HF convaiinnovations/laya at
# commit 55cf4c4ebb4e, the model card with it.
#
# A single-pass model: no KV cache, no context window to choose. The shape is
# the loader's own count (weights of all three checkpoints; the workspace is
# one pass of 16384 tokens / 512 questions), measured on the A6000 2026-09-25.

