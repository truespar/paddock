# ── NVIDIA's hybrid mamba/attention MoE  ──────────────────────────
#
# 52 layers, but only SIX of them are attention - the other 46 are mamba-2
# mixers and MoE blocks. That is why the context number is not a typo and not
# expensive: the paged KV pool for a 32-slot server at 4K ctx is 0.40 GiB,
# because there are only six layers to page. What the model pins instead is
# recurrent state, and that is what `workspace` below carries.
#
# Weights are NVIDIA's own NVFP4 export (modelopt), MIXED_PRECISION: the expert
# and FFN planes are NVFP4, the mamba `in_proj`/`out_proj` planes are FP8, and
# the KV quant algo is FP8. The engine serves the checkpoint directory itself
# (--model <dir>), not a GGUF conversion.
[[model]]
id = "nemotron-3.5-lightning-30b"
# KV8 by default (2026-10-04): mirrors the engine family default
kv_default = "fp8_e4m3"
mtp_in_file = true
vendor = "NVIDIA"
display = "Nemotron 3.5 Lightning 30B-A3B"
family = "nemotron-h"
capability = ["chat", "tools", "reasoning", "speculative"]
license = "openmdw-1.1"
revision = "2026-08-18"

  [model.specs]
  params = "30B total, 3B active"
  context = "1M"
  published_at = "2026-08-11"
  published_source = "https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
  homepage = "https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
  about = "NVIDIA's hybrid reasoning model - mostly mamba layers with a few attention layers, so long conversations stay cheap instead of getting slower the further they go."
  strengths = [
    "Very long context without the usual memory cost - only 6 of 52 layers page a KV cache",
    "Thinks before answering, and calls tools",
    "3B active parameters out of 30B - answers at a small model's speed",
  ]
  tradeoffs = [
    "On cards older than Ada it answers one request at a time - serving several at once needs FP8 hardware",
    "Holds ~1.8 GB of recurrent state beyond the weights at 32 slots",
    "Reasoning output is verbose unless you ask it to be brief",
  ]

  [[model.artifact]]
  id = "q8"
  kind = "weights"
  format = "gguf"
  label = "Full quality"
  quant = "Q8_0"
  # The default off Blackwell: NVFP4 (below) is the marked default and
  # `default_weights_for` falls back to this floorless lane where it cannot
  # run (decided 2026-10-04 - the granite-4.2 precedent; every agentic board ran
  # the NVFP4 lane). Its drafter is the in-file MTP head, so `companions = []`
  # keeps DSpark/DFlash (NVFP4 drafters) off this lane.
  default = false
  # No min_cc: the Q8_0 lane is the int8 dp4a ladder, which every generation we
  # serve has. Verified live on an RTX A6000 (sm_86) - loads in ~20 s, 33.11
  # GiB resident measured by bracketing nvidia-smi across the run. sm_86
  # cannot batch this model (the batch lane needs f8row_gemm,
  # i.e. FP8, i.e. sm_89+) so it serves serially there - which is a concurrency
  # limit, not a fit limit, and the tradeoffs line says so.
  #
  # Same workspace as the NVFP4 arm: the mamba arenas are f32 and sized by SLOT
  # COUNT, not by weight quant, so the figure does not move with the format.
  workspace = 1899342848

  # Native Metal Q8 trunk only. The CUDA Q8/NVFP4/MTP contracts above and
  # below stay unchanged. Independent testing continues.
  [model.artifact.runtime]
  backends = ["cuda", "metal"]
  companions = []
  # CUDA starts that name no window target 262K at 4 slots (decided 2026-10-04:
  # agent sessions run 100K+ deep), fitted to the card at admission like the
  # Studio form; six attention layers make the window cheap - the slots are
  # what cost (mamba arenas). Metal keeps its own 32K default.
  [model.artifact.runtime.backend_overrides.cuda]
  default_max_ctx = 262144
  default_max_batch = 4
  [model.artifact.runtime.backend_overrides.metal]
  qualification = "qualified"
  capability = ["chat", "tools", "reasoning"]
  companions = []
  kv_cache_dtype = "f16"
  note = "Native Metal Q8: F32 matrix-based Mamba-2 prefill, GPU ReLU² experts and paired state/KV prefixes. Real GPU gates and 18/18 first tokens, 5/5 complete short generations pass, but only 17/60 longer capped outputs match; end-to-end throughput/TTFT trail llama.cpp. No vision, NVFP4 or MTP/DFlash. Broader generation, memory-estimator and performance qualification remain open."
  [model.artifact.runtime.backend_overrides.metal.memory]
  weight_bytes = 33577599744
  nextn_bytes = 0
  source = "measured"
  max_ctx = 32768
  max_batch = 64
  full_paged_kv = true
  kv_reserve_sequences = 1
  # Upper bound of native scratch across the declared 32K/64-slot ceiling.
  # The estimator's hybrid checkpoint floor remains conservative; this is
  # not an exact admission prediction. The loader enforces the actual grant.
  workspace_bytes = 677817604
  recurrent = { layers = 23, state_elems = 524288, conv_elems = 18432, conv_dim = 6144, elem_bytes = 4 }

  [model.artifact.shape]
  weight_bytes = 34997444864
  kind = "generative"
  vocab = 131072
  max_ctx = 1048576
  nextn_bytes = 1419146240
  source = "measured"
  kv_layers = [
    { k_dim = 256, v_dim = 256, count = 6 },
  ]

    [model.artifact.shape.recurrent]
    layers = 46
    state_elems = 1048576
    conv_elems = 30720
    conv_dim = 10240
    elem_bytes = 4

    [[model.artifact.file]]
    url = "https://models.truespar.io/models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q8_0.gguf"
    dest = "NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Q8_0.gguf"
    sha256 = "dc5276dd0619c04e277504d2358a793e31ccbe39e894d767d0d14f2a221e2ca4"
    size = 35004643392

  [[model.artifact]]
  id = "nvfp4"
  kind = "weights"
  format = "safetensors"
  label = "Compact (Blackwell)"
  quant = "NVFP4"
  # The default on Blackwell (decided 2026-10-04): the lane every agentic and
  # rival board ran; Q8_0 above is the default everywhere else.
  default = true
  # sm_120a or better, same reason as the Qwen3.8 NVFP4 artifact: the W4A16
  # nvf4 consumers compile under PD_BS_OK (__CUDA_ARCH__ >= 1200 && SM120_ALL).
  # The floor is a KERNEL fact, not a format one - NVFP4 is a storage format and
  # the scalar GEMV that reads it carries no Blackwell-only instruction (see
  # packs/cuda/). When the nvf4->f8w8 bridge lands this
  # drops to [8, 9] and the label loses its parenthetical, because Ada and
  # Hopper are exactly the cards that have FP8 to unpack into.
  min_cc = [12, 0]
  # Device bytes pinned BEYOND the file bytes at the default 32 slots, computed
  # from the engine's own sizing (gpu_model/nemotron/batch.rs): per-slot mamba
  # arenas 1,597,767,680 + serving scratch 301,575,168. Reproduces the loader's
  # own report to the rounding (2.17 vs the logged 2.18 GiB once the 0.40 GiB
  # KV pool the estimator prices separately is added back). The arenas dominate
  # and scale with SLOTS, not with context - the opposite of a KV cache.
  workspace = 1899342848
  # Same 262K x 4 CUDA target as Q8_0 above. No published shape to fit with
  # yet, so admission writes the target as is; at ~3 KB of fp8 KV a token
  # (six attention layers) it is ~3.75 GiB of pool at 4+1 sequences.
  runtime = { default_max_ctx = 262144, default_max_batch = 4 }

