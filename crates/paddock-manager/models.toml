  # NVIDIA's DSpark drafter for this checkpoint - their recommended drafter for
  # the DGX Spark (card: accepted length 3.75 vs DFlash's 3.16), attached with
  # --mtp like DFlash (the same seat: a causal sliding-window block with sinks
  # and a low-rank Markov head, nemotron/dflash.rs). Listed ahead of DFlash so
  # every "the model's drafter" lookup lands here. Measured on GB10 (32K, 1
  # slot, DSpark vs DFlash at their elected depths): tool-carrying sampled
  # 126.5 vs 118.0 tok/s, code 129.7 vs 105.4, 24K code 120.8 vs ~111; and it
  # keeps paying up to 8 live sessions; a Claude Code replay to 248K decodes
  # at 105.6 tok/s on it. The DEFAULT drafter on Blackwell (decided 2026-10-04):
  # pulled and wired with the NVFP4 lane, the way qwen3.8's DFlash2 is - the
  # min_cc floor keeps it off cards that cannot run its NVFP4 planes, and the
  # Q8_0 lane's empty companion list keeps it off that lane. Mirror bytes verified identical to the upstream
  # download (weights: the R2 ETag is the file's MD5; the README is the
  # mirror's own revision).
  [[model.artifact]]
  id = "dspark"
  kind = "drafter"
  format = "safetensors"
  label = "Speed boost (draft model)"
  default = true
  min_cc = [12, 0]

