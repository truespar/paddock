# Clef (Cloudflare, released 2026-10-01): a post-trained Qwen3.5-9B (with its
# vision tower) under a joint schema head that scores every option of every
# question in ONE pass over one joint sequence - the state, then the whole
# schema. The same /v1/systemone body Laya answers, far stronger on the
# vendor's Decision Index (MMLU 91.8 vs 30.7, BFCL 98.8 vs 38.1) at 9B instead
# of 0.4B.
#
# Q8_0 default (2026-10-03): ggml-org/Clef-Flash-GGUF rev
# 4a7a08c09bc6, llama.cpp's own converter on Cloudflare/clef-flash rev
# 17f0b0ad64ef plus llama-quantize, mirrored unchanged and sha256-checked
# against the LFS id. ggml-org is named here deliberately, as for gpt-oss: no
# official or unsloth GGUF of Clef exists, and this is a straight conversion
# of Cloudflare's release by llama.cpp's maintainers, not a re-quant recipe.
# Q8_0 moves the release's answers about as far as Cloudflare's own BF16
# serving does (probabilities median 0.0007 / worst 0.032 against its 0.0012
# / 0.050 over 26 fixtures, no flips either) at half the memory, so the
# official BF16 checkpoint is not in the catalog any more (it was mirrored
# here 2026-10-02 to 10-03): the engine still loads it, downloaded by hand
# from Hugging Face. Metal serves packed Q8_0 and the separately requested
# mlx-community affine-8/group-64 checkpoint, both with their exact vision tower.
#
# The GGUF holds the backbone and head only; the vision companion is OUR cut
# of the release's own tower - its model.visual.* tensors byte for byte, its
# config.json and processor_config.json verbatim in the header (our companion
# cutter) - so images read exactly as on the release. Served Q8_0 as stored
# (int8 rows and the file's f16 block scales, slot 741: the backbone's
# two-part bf16 activation split against the exact int8, F32 everywhere else,
# attention 3xTF32): against the release evaluated in F32 with these Q8_0
# weights, logits within 5.2e-5 and probabilities 2.0e-5 on the text
# fixtures, 2.0e-4 / 1.6e-5 on the image fixtures (preprocessed as the
# reference's processor and decoded as its libjpeg-turbo, byte for byte), no
# flips; tokenization from the GGUF token-exact on all 26. Measured on the
# DGX Spark 2026-10-03: 9.66 GB of weights without the tower.

[[model]]
id = "clef-flash"
vendor = "Cloudflare"
display = "Clef Flash"
family = "clef"
capability = ["decision", "vision"]
license = "apache-2.0"
revision = "2026-10-03"

  [model.specs]
  params = "9B + 122M schema head"
  context = "16K tokens a request (state + schema)"
  published_at = "2026-10-01"
  published_source = "https://developers.cloudflare.com/changelog/post/2026-10-01-clef-workers-ai/"
  homepage = "https://huggingface.co/Cloudflare/clef-flash"
  about = "Answers a whole schema of typed questions about a state - text, JSON or pictures - pick one of these, score it on this scale, yes or no - in one pass, every answer seeing every other question. It writes nothing: the same /v1/systemone call Jev clients make, with a probability for every option."
  strengths = [
    "Decides every field jointly from one read of the state",
    "Strong reasoning for its size - MMLU 91.8, BFCL 98.8 on the vendor's Decision Index",
    "Reads states up to 16K tokens; any number of options a question",
    "Reads images too on CUDA and Metal - up to 16 a request",
  ]
  tradeoffs = [
    "A 9B model - hundreds of milliseconds a request where Laya takes a few",
