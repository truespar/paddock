# Bonsai 2 27B sourcing: Prism ML's own repo (huggingface.co/prism-ml), the
# model's authors - an official source, not a community re-quant. It is
# Qwen3.8-27B with the architecture unchanged and EVERY linear, the embedding
# and the head included, in ternary weights: PTQ1_0 packs five trits a byte,
# 1.75 bits a weight, and the file is served as shipped - 5.95 GB on disk and
# resident, nothing expanded. sha256 is the upstream LFS oid, re-verified
# against the bytes at upload (2026-09-20).
#
# The file also asks something of the runtime: every linear's input goes
# through a block-1024 Walsh-Hadamard rotation (`prism.hadamard.*` in its
# header). Stock llama.cpp cannot read it; the qwen35 engine family applies the
# rotation and every other family refuses the file.
#
# No nextn block in the file and no drafter lane for it yet, so no
# "speculative".
#
# Vision: upstream ships a qwen3vl mmproj beside the weights and it is
# published here under upstream's own name. It is its own FILE (own sha256,
# Prism ML's `general.*` identity) around the Qwen 3.8 27B tower: all 334
# tensors compare byte-identical to that model's mmproj-BF16 and no `clip.*`
# key differs, so the tower carries no rotation - image rows land in the
# model-basis residual stream after the embedding inverse. BF16, never the
# Q8_0 sibling (the tower rule on every row). The macOS MLX package brings its
# own tower inside the bundle and takes no companion.
# Apache-2.0; Prism ML's NOTICE rides with the weights.
[[model]]
id = "bonsai-2-27b"
vendor = "Prism ML"
display = "Bonsai 2 27B"
family = "bonsai"
capability = ["chat", "vision", "tools", "reasoning"]
license = "apache-2.0"
revision = "2026-09-27"
# the CUDA engine pools this line's KV at fp8-e4m3 when nothing overrides it
# (gpu_model/qwen35/load.rs, the rotated-basis election) - keep in step with
# the engine. Metal's artifacts carry their own KV contract below.
kv_default = "fp8_e4m3"

  [model.specs]
  params = "27B"
  context = "256K"
  homepage = "https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf"
