# ── Granite 4.2 ─────────────────────────────────────────────────────────────
#
# Same DECODER as 4.1 - `general.architecture = granite`, identical geometry at
# each size - so it serves on the existing granite path with no engine change.
# What did move, and what each change cost:
#
#   * the muP scalars go to identity: embedding_scale 12 -> 1, residual_scale
#     0.175 -> 1, logit_scale 16 -> 1. All four are still written in the header
#     (`granite.*_scale`), so the loader's `f_req` reads them and the math
#     degrades to identity honestly rather than by omission.
#   * embeddings untie, so `output.weight` is a real tensor. The loader already
#     branched on PRESENCE rather than on the config flag, so this was free.
#   * the template gains a `<think>` region AND switches tool calls from
#     4.1's Hermes-style JSON to Qwen's XML form. Both are what
#     `Dialect::QwenXml` already speaks - but `arch` is `granite` for both
#     versions, so the dialect now comes from the TEMPLATE (see
#     `Dialect::for_arch_and_template`). Keyed on arch alone, 4.2 served its
#     whole reasoning block as user-visible content.
#   * it publishes sampling (temperature 1.0, top_p 0.95) where 4.1 published
#     none - carried in the GGUF as `general.sampling.*`, which is why
#     `sampling::published_in_gguf` exists.
#
# Greedy parity vs llama.cpp b10628 on the identical 8b GGUF: prompts tokenize
# identically and step-0 agrees 18/18. Long thinking streams part on near-ties
# (delta-margin median 0.100 nats) with both engines answering correctly, which
# is the documented behaviour for a reasoning model, not a defect.
#
# Both tiers are published, and both were served before publishing. The NVFP4
# checkpoints needed new engine capability to get here - granite had no
# safetensors-primary loader before `granite/load_hf.rs`, and the
# trap it had to clear is documented there: llama.cpp's converter PERMUTES the
# q/k rows into the GGUF for its interleaved rope, so a checkpoint read straight
# from HF needs the same permutation or it produces fluent nonsense.
#
# Validation differs between the tiers and the difference is real: Q8_0 has a
# same-weights greedy-parity check against llama.cpp on the identical file
# (step-0 18/18), while NVFP4 has no such reference - llama.cpp cannot read
# compressed-tensors - so it is validated against the Q8_0 lane at the
# activation level plus content checks.

