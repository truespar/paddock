# DiffusionGemma 26B-A4B (Google, 2026-06): the Gemma 4 26B-A4B body
# generating by BLOCK DIFFUSION - a 256-token canvas denoised in parallel
# (up to 48 steps, ~15-20 tokens per forward), committed, then the next
# block. Same family module as gemma-4-26b-a4b (gpu_model/gemma4, arch
# `diffusion-gemma`), plus the self-conditioning MLP and a transposed
# embedding the lane holds resident. Google ships no GGUF; unsloth's is the
# only one, and the engine was gated on it (2026-09-23, A6000: a sentence in
# 11 steps / 4.2 s; the yes/no structured read at 80 % label mass). Vision:
# no quantizer ships a tower for it, and Gemma 4 26B's is not a stand-in -
# DiffusionGemma kept Gemma 4's vision encoder layers but retrained the patch
# embedder, the position table and the projection. Its own mmproj is built
# from the official checkpoint (353 of 356 tensors are Gemma 4's, byte for
# byte). Both CUDA and Metal use this companion; MLX embeds its own tower.
# Sampling: the file's own schedule (temperature 0.8 -> 0.4 over the steps,
# entropy bound 0.1, stop at mean entropy < 0.005) - not a customer knob.
[[model]]
