# ─────────────────────────────────────────────────────────────────────────────
# Speech-to-text. Four ASR models in two shapes, and the shapes
# matter to the picker because they cost memory in completely different ways:
#
#   Qwen3-ASR is a GENERATIVE model with an AUDIO mmproj - a Qwen3 decoder
#   that happens to be fed by a speech encoder. Ordinary ctx-scaling KV, plus
#   a resident tower, exactly like a vision model.
#
#   The three whisper fine-tunes are ENCODER-DECODERS with no companion at
#   all: the audio encoder ships inside the weights file. Their memory is
#   dominated by a static CROSS-attention cache the decoder holds over the
#   encoder output - 234 MiB per concurrent transcription at f16, 117 at the
#   fp8 default - which does not grow with the transcript and does not shrink
#   for a short clip, because whisper's audio window is a fixed 30 s either
#   way. probe.rs reads it (`cross_kv`) and the estimator charges it per slot;
#   before that landed, a whisper file probed as zero kv layers and the picker
#   would have printed a fit verdict with no cache priced at all.
#
# PUBLISHED: every url below was fetched from the origin after
# upload, and every sha256/size was re-derived from the local file and diffed
# against this table. (A row can sit as "publish pending" first - real digests,
# bytes not yet up. That state is honest but temporary, and the
# check that clears it is fetching the url, not remembering that you ran the
# uploader.)
#
# The three whisper GGUFs are our conversions of the official checkpoints
# (our whisper converter - llama.cpp's converter cannot do
# whisper, so the schema is paddock's own). Labeled f16, which is what they
# are; NB and Røst were downcast from fp32/bf16 respectively at conversion.

[[model]]
id = "qwen3-asr-1.7b"
vendor = "Alibaba"
display = "Qwen3-ASR 1.7B"
family = "qwen3"
capability = ["transcription"]
license = "apache-2.0"
revision = "2026-08-09"

  [model.specs]
