[package]
name = "paddock-metal"
description = "Paddock's native Apple GPU execution backend and Metal kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
hardened = ["paddock-models/hardened", "paddock-engine/hardened"]

[dependencies]
paddock-engine = { path = "../paddock-engine", default-features = false }
paddock-models.workspace = true
paddock-tokenizer.workspace = true
thiserror.workspace = true
tracing.workspace = true
half.workspace = true
serde_json.workspace = true
blake3.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"

[dev-dependencies]
paddock-kernels = { path = "../paddock-kernels" }

[lints]
workspace = true
